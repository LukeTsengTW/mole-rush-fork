      - name: Prepare GitHub Pages
        run: |
          echo "===== Build output ====="
          find dist/client -maxdepth 4 -type f | sort | head -200

          rm -rf site
          mkdir -p site

          # 先複製整個靜態網站
          cp -a dist/client/. site/

          # Vinext 使用 assetPrefix=/mole-rush 時，
          # 會把資源實體檔案放在 mole-rush/ 子目錄。
          # GitHub Project Pages 本身已經掛在 /mole-rush/，
          # 所以這裡把它攤平到網站根目錄。
          if [ -d site/mole-rush ]; then
            echo "===== Flatten mole-rush asset directory ====="
            cp -a site/mole-rush/. site/
            rm -rf site/mole-rush
          fi

          touch site/.nojekyll

          echo "===== Final site ====="
          find site -maxdepth 5 -type f | sort | head -200

          test -f site/index.html
